{% block titulo %}{{ Rating.author }}{% endblock %}
{% block Rating %}
<article>
    <h1>{{ Rating.author }}</h1>
    <p class="text-muted">
        Por <strong>{{ Rating.author.username }}</strong> ·
    </p>
    <hr>
    <!-- <div class="mt-3">{{ Rating.stars |linebreaks }}</div> -->
    <div class="mt-3">
        {% for _ in Rating.range %}
        ⭐
        {% endfor %}
    </div>
    <div class="mt-3">{{ Rating.comments|linebreaks }}</div>
</article>

{% if User == Rating.author %}
<div class="mt-4 d-flex gap-2">
    <a href="{% url 'edit_ratings' Rating.pk %}" class="btn btn-outline-secondary">Editar</a>
    <a href="{% url 'remove_ratings' Rating.pk %}" class="btn btn-outline-danger">Eliminar</a>
</div>
{% endif %}

{% endblock %}
