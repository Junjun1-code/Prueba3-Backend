{% extends 'tienda/base.html' %}
{% block titulo %}{{ accion }} Valoracion {% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1 class="mb-4">{{ accion }} Valoracion </h1>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.stars.id_for_label }}" class="form-label">{{ form.stars.label }}</label>
                {{ form.stars }}
            </div>
            <div class="mb-3">
                <label for="{{ form.comments.id_for_label }}" class="form-label">{{ form.comments.label }}</label>
                {{ form.comments }}
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{{ accion }}</button>
                <a href="{% url 'item_list' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
