{% extends 'tienda/base.html' %}
{% block titulo %}{{ accion }} Artículo{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h1 class="mb-4">{{ accion }} Artículo</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.itemname.id_for_label }}" class="form-label">{{ form.itemname.label }}</label>
                {{ form.itemname }}
            </div>
            <div class="mb-3">
                <label for="{{ form.price.id_for_label }}" class="form-label">{{ form.price.label }}</label>
                {{ form.price }}
            </div>
            <div class="mb-3">
                <label for="{{ form.img.id_for_label }}" class="form-label">{{ form.img.label }}</label>
                {{ form.img }}
            </div>
            <div class="mb-3 form-check">
                {{ form.published }}
                <label class="form-check-label" for="{{ form.published.id_for_label }}">
                    {{ form.published.label }}
                </label>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">{{ accion }}</button>
                <a href="{% url 'list_items' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
